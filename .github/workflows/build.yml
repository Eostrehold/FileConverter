name: Build

on:
  push:
    branches: [ main, integration ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild FileConverter.sln /t:Restore

      - name: Build FileConverterExtension
        run: msbuild Application\FileConverterExtension\FileConverterExtension.csproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build FileConverter
        run: msbuild Application\FileConverter\FileConverter.csproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-x64
          path: Application\FileConverter\bin\x64\Release
